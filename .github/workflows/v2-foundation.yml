name: V2 foundation
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, bundles: nsis }
          - { name: macOS Apple Silicon, os: macos-14, bundles: 'app,dmg' }
          - { name: macOS Intel, os: macos-15-intel, bundles: 'app,dmg' }
          - { name: Linux x64, os: ubuntu-22.04, bundles: 'deb,appimage' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_BUILD_JOBS: 2
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - name: Dependencies
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:rust
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked --jobs 2
      - name: Production bundle (also builds frontend)
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: MyLibrary-${{ matrix.name }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
  # Bundles are CI artifacts, never automatic releases or tags. Signed publishing needs explicit approval.
