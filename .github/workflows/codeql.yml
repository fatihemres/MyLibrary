name: CodeQL
on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]
# No schedule/dispatch: this workflow initially exists only outside default branch main.
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust analysis toolchain
        if: matrix.language == 'rust'
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
